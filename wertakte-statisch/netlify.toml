# Rein statische Seite, kein Build-Schritt. Netlify liefert den Ordner
# unveraendert aus.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Der Service Worker darf nie aus dem Zwischenspeicher kommen, sonst haengt
# das Geraet auf einer alten Fassung fest.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
